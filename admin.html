
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel da artista — artbreh</title>
    <link rel="stylesheet" href="admin.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="admin.js" defer></script>
</head>
<body>
    <main class="container">
        <header class="cabecalho">
            <h1>Painel da artista</h1>
            <a href="index.html">Ver galeria</a>
        </header>

        <p id="status" role="status" aria-live="polite">
            Preparando painel…
        </p>

        <section id="login-secao" hidden>
            <h2>Entrar</h2>
            <form id="login-form">
                <label for="email">E-mail</label>
                <input id="email" type="email" autocomplete="username" required>

                <label for="senha">Senha</label>
                <input id="senha" type="password"
                    autocomplete="current-password" required>

                <button id="entrar" type="submit">Entrar</button>
            </form>
        </section>

        <section id="painel-secao" hidden>
            <div class="painel-acoes">
                <button id="nova-obra" type="button">Adicionar obra</button>
                <button id="sair" type="button">Sair</button>
            </div>

            <section aria-labelledby="form-titulo">
                <h2 id="form-titulo">Adicionar obra</h2>

                <form id="obra-form">
                    <label for="titulo">Título</label>
                    <input id="titulo" type="text" maxlength="200" required>

                    <label for="legenda">Legenda</label>
                    <textarea id="legenda" rows="4"></textarea>

                    <label for="imagem">Foto da obra</label>
                    <input id="imagem" type="file"
                        accept="image/jpeg,image/png,image/webp"
                        aria-describedby="imagem-ajuda">
                    <p id="imagem-ajuda">
                        Use JPG, PNG ou WebP. Ao editar, deixe vazio
                        para manter a foto atual.
                    </p>
                    <img id="imagem-preview" alt="Prévia da obra" hidden>

                    <label for="tecnica">Técnica</label>
                    <input id="tecnica" type="text"
                        placeholder="Ex.: acrílica sobre tela">

                    <label for="dimensoes">Dimensões</label>
                    <input id="dimensoes" type="text"
                        placeholder="Ex.: 40 × 60 cm">

                    <label for="preco">Preço (R$)</label>
                    <input id="preco" type="number" min="0" step="0.01">
                    <p>Deixe vazio para exibir “Preço sob consulta”.</p>

                    <label class="checkbox" for="vendida">
                        <input id="vendida" type="checkbox">
                        Obra vendida
                    </label>

                    <div class="form-acoes">
                        <button id="salvar" type="submit">Salvar obra</button>
                        <button id="cancelar" type="button">Cancelar edição</button>
                    </div>
                </form>
            </section>

            <section aria-labelledby="obras-titulo">
                <h2 id="obras-titulo">Obras cadastradas</h2>
                <div id="lista-obras"></div>
            </section>
        </section>
    </main>
</body>
</html>
